<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Inspector</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Image Inspector</h1>
      <p>Select an image to preview it and inspect its basic details. Your file stays on your device.</p>

      <label for="image-file">Choose an image</label>
      <input id="image-file" type="file" accept="image/*" aria-describedby="status">
      <p id="status" role="status">No image selected.</p>

      <section id="inspection" aria-label="Image inspection" hidden>
        <div id="preview"></div>
        <section aria-labelledby="detection-heading">
          <h2 id="detection-heading">Object detection</h2>
          <button id="detect-button" type="button">Detect objects</button>
          <p id="detection-status" role="status" aria-live="polite"></p>
          <ul id="detections" aria-label="Detected objects"></ul>
        </section>
        <h2>File details</h2>
        <dl>
          <dt>File name</dt>
          <dd id="file-name"></dd>
          <dt>MIME type</dt>
          <dd id="mime-type"></dd>
          <dt>File size</dt>
          <dd id="file-size"></dd>
          <dt>Dimensions (width × height)</dt>
          <dd id="dimensions"></dd>
        </dl>
      </section>
    </main>
  </body>
</html>
